version: '3.8'

services:
  mantra-voice-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mantra-voice-agent:latest
    container_name: mantra-voice-app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
