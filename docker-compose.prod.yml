version: '3.8'

services:
  ui:
    image: bunker.mantracare.com/mantra-ai/telephony:2.5.0
    container_name: mantra-voice-app
    restart: always
    command: all
    env_file:
      - .env.prod
    ports:
      - "8081:8081"
    extra_hosts:
      - "tele-staging.mantracare.com:host-gateway"
    networks:
      - mc-space
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1536M
        reservations:
          cpus: '0.35'
          memory: 512M
    depends_on:
      - postgres
      - livekit-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: lkt-livekit-server
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-52000:50000-52000/udp"
    networks:
      - mc-space
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.20'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  sip:
    image: livekit/sip:latest
    container_name: lkt-livekit-sip
    restart: unless-stopped
    depends_on:
      - livekit-server
    environment:
      SIP_CONFIG_BODY: |
        api_key: 'devkey_4b19b9896c7018e6'
        api_secret: '37f60141b419ba220cd81ae2d31ddd9192a926f3b9fba124'
        ws_url: 'ws://livekit-server:7880'
        redis:
          address: 'redis:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: info
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-20000:10000-20000/udp"
    networks:
      - mc-space
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 192M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: lk_postgres_logs
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-call_logs_db}
    ports:
      - "5444:5432"
    networks:
      - mc-space
    volumes:
      - lk_logs_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
        reservations:
          cpus: '0.05'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  adminer:
    image: adminer:latest
    container_name: lk_adminer_logs
    restart: always
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    networks:
      - mc-space
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lk_logs_data:

networks:
  mc-space:
    external: true