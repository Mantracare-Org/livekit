services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: lkt-selfhost-livekit
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml --redis-host localhost:6379
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

  sip:
    image: livekit/sip:latest
    container_name: lkt-selfhost-sip
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit-server
    environment:
      SIP_CONFIG_BODY: |
        api_key: 'devkey_4b19b9896c7018e6'
        api_secret: '37f60141b419ba220cd81ae2d31ddd9192a926f3b9fba124'
        ws_url: 'ws://localhost:7880'
        redis:
          address: 'localhost:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: debug